<!doctype html>
<!--
ui/apps/ai.html
WHAT THIS FILE DOES
  A simple AI chat. Typing is hard with hand gestures, so it offers ready-made question buttons
  (plus a text box for a physical keyboard). Questions go to the hub (/api/ai), which holds the
  API key and talks to the AI provider, so no secret is ever in this page.
-->
<html lang="en"><head><meta charset="utf-8"><title>AI chat</title>
<!-- Styles: dark theme; buttons get a blue border while the cursor is over them. -->
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111827; color: #fff; padding: 32px; box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; }
  h1 { font-weight: 500; margin: 0 0 16px; }
  #presets { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  button { font-size: 22px; padding: 14px 22px; border-radius: 12px; border: 3px solid transparent; background: #374151; color: #fff; cursor: pointer; }
  button.hot { border-color: #38bdf8; }
  #row { display: flex; gap: 12px; margin-bottom: 16px; }
  input { flex: 1; font-size: 22px; padding: 12px; border-radius: 10px; border: 0; }
  #out { flex: 1; background: #1f2937; border-radius: 12px; padding: 20px; font-size: 24px; line-height: 1.5; white-space: pre-wrap; overflow: auto; }
</style></head>
<body>
<h1>AI chat</h1>
<div id="presets"></div>
<div id="row"><input id="q" placeholder="Type with a keyboard, or use the buttons above"><button id="send">Ask</button></div>
<div id="out">Choose a question.</div>
<script>
// The answer area and the text input.
const out = document.getElementById('out'), q = document.getElementById('q');
// Ready-made questions (easy to select by pointing and pinching).
const presets = ['Tell me a fun fact', 'Explain how a projector works in 3 sentences', 'Give me a riddle', 'What is a hand gesture UI good for?'];
// Send a question to the hub and show the answer, or a clear message if the AI is unavailable.
async function ask(text) {
  out.textContent = 'Thinking...';
  try {
    const r = await fetch('/api/ai', { method: 'POST', body: JSON.stringify({ prompt: text }) });
    const j = await r.json();
    out.textContent = j.ok ? j.text : ('AI unavailable: ' + j.error);
  } catch (e) { out.textContent = 'AI unavailable: the hub could not be reached.'; }
}
// Create one button per ready-made question.
const box = document.getElementById('presets');
presets.forEach(p => { const b = document.createElement('button'); b.textContent = p; b.onclick = () => ask(p); box.appendChild(b); });
// The Ask button for typed questions (needs a physical keyboard).
document.getElementById('send').onclick = () => { if (q.value.trim()) ask(q.value.trim()); };
// Hover highlight, driven by the synthetic cursor's mouse-move events.
let hot = null;
addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('button');
  if (hot !== t) { if (hot) hot.classList.remove('hot'); hot = t; if (hot) hot.classList.add('hot'); }
});
</script></body></html>
